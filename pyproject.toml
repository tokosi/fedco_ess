[project]
name = "fedco_ess"
authors = [{ name = "FEDCO", email = "it@fedco.example" }]
description = "Employee Self-Service portal for ERPNext: a branded hub over Frappe HR"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
hrms = ">=15.0.0,<17.0.0"
